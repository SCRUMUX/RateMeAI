name: RU edge diagnostic

# Read-only one-shot helper that SSH-es into the RU VPS and prints
# ``docker compose ps`` plus the last lines of selected service logs.
#
# Triggered manually (workflow_dispatch).  Useful for poking at the
# bot / app / nginx state after a deploy without re-running an
# expensive update.sh.

on:
  workflow_dispatch:
    inputs:
      tail_lines:
        description: 'How many tail lines to print per service'
        required: false
        default: '40'
      stop_bot:
        description: 'Stop the bot service on the VPS (yes/no)'
        required: false
        default: 'no'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Validate RU secrets
        env:
          RU_SSH_HOST: ${{ secrets.RU_SSH_HOST }}
          RU_SSH_KEY: ${{ secrets.RU_SSH_KEY }}
          RU_SSH_USER: ${{ secrets.RU_SSH_USER }}
        run: |
          if [ -z "$RU_SSH_HOST" ] || [ -z "$RU_SSH_KEY" ] || [ -z "$RU_SSH_USER" ]; then
            echo "::error::RU_SSH_HOST / RU_SSH_KEY / RU_SSH_USER must be set"
            exit 1
          fi

      - name: SSH and dump compose state
        uses: appleboy/ssh-action@v1
        env:
          TAIL_LINES: ${{ inputs.tail_lines }}
          STOP_BOT: ${{ inputs.stop_bot }}
        with:
          host: ${{ secrets.RU_SSH_HOST }}
          username: ${{ secrets.RU_SSH_USER }}
          key: ${{ secrets.RU_SSH_KEY }}
          port: 22
          command_timeout: 2m
          envs: TAIL_LINES,STOP_BOT
          script: |
            cd /opt/ratemeai
            if [ "$STOP_BOT" = "yes" ]; then
                echo "===== stopping bot service ====="
                docker compose -f docker-compose.ru.yml stop bot 2>&1 || true
                docker compose -f docker-compose.ru.yml rm -f bot 2>&1 || true
                echo "bot service stopped + removed"
            fi
            echo "===== docker compose ps ====="
            docker compose -f docker-compose.ru.yml ps
            echo ""
            echo "===== bot logs (tail $TAIL_LINES) ====="
            docker compose -f docker-compose.ru.yml logs --tail="$TAIL_LINES" bot 2>&1 || echo "(bot service not found)"
            echo ""
            echo "===== app logs (tail $TAIL_LINES) ====="
            docker compose -f docker-compose.ru.yml logs --tail="$TAIL_LINES" app 2>&1 || true
            echo ""
            echo "===== nginx logs (tail 20) ====="
            docker compose -f docker-compose.ru.yml logs --tail=20 nginx 2>&1 || true
            echo ""
            echo "===== /etc/letsencrypt/live ====="
            sudo ls -la /etc/letsencrypt/live/ 2>&1 || true
            echo ""
            echo "===== nginx running config (server_name / listen) ====="
            docker compose -f docker-compose.ru.yml exec -T nginx sh -c "nginx -T 2>/dev/null | grep -E 'server_name|listen [0-9]'" 2>&1 || true
            echo ""
            echo "===== telegram API reachability (api.telegram.org from VPS) ====="
            curl -s -o /dev/null -w "HTTP %{http_code} time_total=%{time_total}s\n" \
                --max-time 10 "https://api.telegram.org/" 2>&1 || echo "  curl exit=$?"
            echo "  (from inside bot container:)"
            docker compose -f docker-compose.ru.yml exec -T bot \
                python -c "import urllib.request, sys; req = urllib.request.Request('https://api.telegram.org/'); r = urllib.request.urlopen(req, timeout=10); print('  HTTP', r.status)" 2>&1 || echo "  bot-side reach failed (expected if Telegram is blocked)"
            echo ""
            echo "===== outbound IP / GeoIP hint ====="
            curl -s --max-time 5 https://ifconfig.me 2>&1 | head -1
            echo ""
            echo "===== .env.ru — bot-related keys (values masked) ====="
            sudo sh -c '
                for key in TELEGRAM_BOT_TOKEN TELEGRAM_BOT_USERNAME BOT_WEBHOOK_URL PEER_BOT_USERNAME EDGE_API_URL; do
                    raw=$(grep -E "^${key}=" /opt/ratemeai/.env.ru 2>/dev/null | head -1 | sed "s/^${key}=//")
                    if [ -z "$raw" ]; then
                        printf "  %-25s = <MISSING>\n" "$key"
                    elif [ ${#raw} -lt 8 ]; then
                        printf "  %-25s = <SHORT len=%d>\n" "$key" "${#raw}"
                    else
                        head=$(echo "$raw" | cut -c1-4)
                        tail=$(echo "$raw" | rev | cut -c1-4 | rev)
                        printf "  %-25s = %s...%s (len=%d)\n" "$key" "$head" "$tail" "${#raw}"
                    fi
                done
            ' 2>&1 || true
