proxy_cache_path /var/cache/nginx/storage levels=1:2 keys_zone=storage_cache:10m max_size=500m inactive=1d;

upstream api_backend {
    server app:8000;
}

# ────────────────────────────────────────────────────────────────────────
# RU edge (v1.61) — single-cert, single-config setup.
#
# Lineage:
#   * /etc/letsencrypt/live/ailookstudio.ru/
#     SAN: DNS:ailookstudio.ru, DNS:www.ailookstudio.ru
#   * Issued via deploy/ru/bootstrap-certs.sh BEFORE this file ships.
#
# Why "everything inside this file" (no extra/*.conf):
#   * The earlier two-phase rollout (TLS-include via a named volume
#     populated at runtime by update.sh) had two failure modes — empty
#     volume on cold-start nginx, and ``nginx -s reload`` not picking
#     up new files dropped into the include glob — both manifesting as
#     CN=ru.ailookstudio.ru leaking to the apex domain.
#   * One cert + one server-block + one file = no race, idempotent,
#     understandable by reading nginx.conf alone.
#
# Variant B (CMS replication) is unchanged: /internal/cms/replicate is
# proxied to the app; HMAC-signed by Railway, validated by the app.
# ────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name ailookstudio.ru www.ailookstudio.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ailookstudio.ru$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name ailookstudio.ru www.ailookstudio.ru;

    ssl_certificate     /etc/letsencrypt/live/ailookstudio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ailookstudio.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Canonical host: www → apex. Single TLS host for SEO and one set of cookies.
    if ($host = www.ailookstudio.ru) {
        return 301 https://ailookstudio.ru$request_uri;
    }

    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for all frontend routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Explicit no-cache for index.html and version.json (must always serve fresh).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # No-cache for favicon/logo — always serve fresh after deploy.
    location = /favicon.png {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /img/logo.png {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Long cache for static assets (JS/CSS/images).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE endpoint: disable buffering for real-time task progress.
    location /api/v1/sse/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding off;
    }

    # API reverse proxy to local FastAPI.
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 10s;
    }

    # /internal/* — CMS replication webhook from Railway. HMAC-signed at
    # the app layer; nginx gives network access to everyone.
    location /internal/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Storage (user images, generated images) — cached at nginx level.
    # ^~ ensures this prefix takes priority over the static-asset regex (.jpg etc.).
    location ^~ /storage/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache storage_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Health/readiness/metrics passthrough.
    location /health {
        proxy_pass http://api_backend;
    }

    location /readiness {
        proxy_pass http://api_backend;
    }

    location /openapi.json {
        proxy_pass http://api_backend;
    }

    location /docs {
        proxy_pass http://api_backend;
    }

    location /redoc {
        proxy_pass http://api_backend;
    }

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
