proxy_cache_path /var/cache/nginx/storage levels=1:2 keys_zone=storage_cache:10m max_size=500m inactive=1d;

upstream api_backend {
    server app:8000;
}

# ────────────────────────────────────────────────────────────────────────
# Variant B — единый CMS hub на Railway, RU edge только читает.
#
# /internal/cms/replicate подписывается HMAC-SHA256 (см.
# src/services/cms_replication.py), поэтому прокси-уровень разрешает
# доступ всем — отсев неавторизованных делает приложение.
#
# ROLLOUT MODEL (двухфазный, авто-детекция в deploy/ru/update.sh):
#
#   Фаза 1 — DNS ailookstudio.ru ещё указывает на Vercel:
#     • :80 server-block ниже принимает ACME challenge на все 3 домена,
#       но реального трафика по ailookstudio.ru/www туда нет.
#     • :443 для ailookstudio.ru/www НЕ объявлен — TLS подгружается
#       через include /etc/nginx/conf.d/extra/*.conf (см. ниже),
#       пустой каталог = nginx стартует без cert-файлов.
#     • :443 для ru.ailookstudio.ru работает, как и раньше.
#
#   Фаза 2 — после смены DNS ailookstudio.ru → IP VPS:
#     • update.sh видит, что dig +short ailookstudio.ru ≡ публичному IP,
#       вызывает certbot certonly --webroot, получает сертификат.
#     • Копирует deploy/ru/nginx-extra-template/ailookstudio-tls.conf
#       в named volume nginx_extra_conf → файл становится виден nginx
#       как /etc/nginx/conf.d/extra/ailookstudio-tls.conf.
#     • nginx -s reload → :443 ailookstudio.ru/www поднимается.
#
# Логика идемпотентна: повторные deploy'ы безопасны, certbot ничего
# не делает если cert уже выпущен, копирование TLS-блока бессмысленно
# но не вредно.
# ────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name ailookstudio.ru www.ailookstudio.ru ru.ailookstudio.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ru.ailookstudio.ru;

    ssl_certificate     /etc/letsencrypt/live/ru.ailookstudio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru.ailookstudio.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Explicit no-cache for index.html and version.json (must always serve fresh)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # No-cache for favicon/logo — always serve fresh after deploy
    location = /favicon.png {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /img/logo.png {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Long cache for static assets (JS/CSS/images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE endpoint: disable buffering for real-time task progress
    location /api/v1/sse/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding off;
    }

    # API reverse proxy to local FastAPI
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 10s;
    }

    # /internal/* — приём CMS replication webhook от Railway. Аутентификация
    # — HMAC-подпись на уровне приложения; nginx даёт сетевой доступ всем.
    location /internal/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Storage (user images, generated images) — cached at nginx level
    # ^~ ensures this prefix takes priority over the static-asset regex (.jpg etc.)
    location ^~ /storage/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache storage_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Health/readiness/metrics passthrough
    location /health {
        proxy_pass http://api_backend;
    }

    location /readiness {
        proxy_pass http://api_backend;
    }

    location /openapi.json {
        proxy_pass http://api_backend;
    }

    location /docs {
        proxy_pass http://api_backend;
    }

    location /redoc {
        proxy_pass http://api_backend;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}

# ────────────────────────────────────────────────────────────────────────
# Lazy include: TLS server-block for ailookstudio.ru / www.ailookstudio.ru
# is dropped here by deploy/ru/update.sh AFTER certbot успешно выпустит
# сертификат (Фаза 2 rollout). Glob "*.conf" не падает на пустом
# каталоге — пока файлов нет, директива просто ничего не подключает.
# Подключаемый файл должен содержать законченные `server { ... }` блоки.
# ────────────────────────────────────────────────────────────────────────
include /etc/nginx/conf.d/extra/*.conf;
