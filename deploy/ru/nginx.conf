proxy_cache_path /var/cache/nginx/storage levels=1:2 keys_zone=storage_cache:10m max_size=500m inactive=1d;

upstream api_backend {
    server app:8000;
}

# ────────────────────────────────────────────────────────────────────────
# Variant B — единый CMS hub на Railway, RU edge только читает.
#
# Замечания по `/internal/cms/replicate`:
#   1. Подпись HMAC-SHA256 по сырому JSON-body (см.
#      ``src/services/cms_replication.py``); сам по себе доступ из
#      произвольного источника безопасен — без секрета payload не
#      будет принят.
#   2. Тем не менее, оборачиваем эндпоинт в network-allowlist через
#      ``geo``-карту, чтобы внешние боты не пытались DDoS-ить
#      verify-логику. Список IP-сетей Railway меняется — поэтому в
#      проде используем ``allow all`` + полагаемся на HMAC. Если
#      нужно сузить, выставите ``CMS_REPL_NETWORK=...`` на VPS и
#      замените блок geo вручную (TODO: вынести в Ansible).
# ────────────────────────────────────────────────────────────────────────

# Хост-валидация для /internal/* — пускаем только с нужным upstream'ом.
# Можно переопределить переменной окружения, по умолчанию открыто
# (HMAC сам по себе достаточен).
geo $cms_replication_allowed {
    default 1;
}

# ──────────────────────────────────────────────────────────────────
# HTTP → HTTPS редиректы для обоих доменов: новый ailookstudio.ru
# и legacy ru.ailookstudio.ru. На период переключения DNS оба
# должны отвечать; после стабилизации legacy уйдёт в 301.
# ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name ailookstudio.ru www.ailookstudio.ru ru.ailookstudio.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────────────
# Основной server-блок: ailookstudio.ru + www.
# RU SPA (build VITE_MARKET=ru) + проксирование /api на FastAPI.
# ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ailookstudio.ru www.ailookstudio.ru;

    ssl_certificate     /etc/letsencrypt/live/ailookstudio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ailookstudio.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # Канонизация: www → apex (один редирект, один TLS handshake).
    if ($host = www.ailookstudio.ru) {
        return 301 https://ailookstudio.ru$request_uri;
    }

    # ── SPA ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /favicon.png {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /img/logo.png {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API ────────────────────────────────────────────────
    location /api/v1/sse/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 10s;
    }

    # ── /internal/* — CMS replication endpoint ─────────────
    # Принимает webhook от Railway (editor) с HMAC-подписью.
    location /internal/ {
        if ($cms_replication_allowed = 0) {
            return 403;
        }
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Storage ────────────────────────────────────────────
    location ^~ /storage/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache storage_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Health/diagnostics passthrough ─────────────────────
    location /health     { proxy_pass http://api_backend; }
    location /readiness  { proxy_pass http://api_backend; }
    location /openapi.json { proxy_pass http://api_backend; }
    location /docs       { proxy_pass http://api_backend; }
    location /redoc      { proxy_pass http://api_backend; }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}

