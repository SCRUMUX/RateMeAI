proxy_cache_path /var/cache/nginx/storage levels=1:2 keys_zone=storage_cache:10m max_size=500m inactive=1d;

upstream api_backend {
    server app:8000;
}

# ────────────────────────────────────────────────────────────────────────
# Variant B — единый CMS hub на Railway, RU edge только читает.
#
# /internal/cms/replicate подписывается HMAC-SHA256 (см.
# src/services/cms_replication.py), поэтому прокси-уровень разрешает
# доступ всем — отсев неавторизованных делает приложение.
#
# ROLLOUT MODEL (трёхфазный, авто-детекция в deploy/ru/update.sh):
#
#   Фаза 1 — DNS ailookstudio.ru ещё указывает на Vercel:
#     • :80 server-block ниже принимает ACME challenge на все 3 домена,
#       но реального трафика по ailookstudio.ru/www туда нет.
#     • :443 server-block'и для ru.ailookstudio.ru и ailookstudio.ru
#       НЕ объявлены в этом файле — они подгружаются через
#       include /etc/nginx/conf.d/extra/*.conf (см. ниже).
#     • update.sh при каждом deploy'е кладёт в extra/:
#         - ru-legacy.conf     → :443 ru.ailookstudio.ru (SPA + API)
#       Этот файл — основа RU edge до DNS-cutover'а.
#
#   Фаза 2 — после смены DNS ailookstudio.ru → IP VPS:
#     • update.sh видит, что dig +short ailookstudio.ru ≡ публичному IP,
#       вызывает certbot certonly --webroot, получает сертификат.
#     • Копирует ailookstudio-tls.conf в extra/ → :443 ailookstudio.ru
#       поднимается рядом с :443 ru.ailookstudio.ru. Оба домена
#       обслуживают трафик параллельно — старые закладки и редкие
#       юзеры на ru.* продолжают работать.
#
#   Фаза 3 — отправляем legacy-домен в 301 (опциональная):
#     • Админ выставляет RU_LEGACY_REDIRECT_ENABLED=1 в env.
#     • update.sh заменяет ru-legacy.conf на ru-legacy-redirect.conf
#       (301 на ailookstudio.ru). Откат — просто убрать переменную.
#
# Логика идемпотентна: повторные deploy'ы безопасны, certbot ничего
# не делает если cert уже выпущен, копирование готовых файлов
# безвредно.
# ────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name ailookstudio.ru www.ailookstudio.ru ru.ailookstudio.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ────────────────────────────────────────────────────────────────────────
# Все 443 server-block'и теперь живут в /etc/nginx/conf.d/extra/.
# Файлы туда кладёт deploy/ru/update.sh из deploy/ru/nginx-extra-template/.
# Это позволяет включать/выключать конкретные домены без перетряхивания
# содержимого nginx.conf (read-only mount из репо).
# ────────────────────────────────────────────────────────────────────────
include /etc/nginx/conf.d/extra/*.conf;
