# ────────────────────────────────────────────────────────────────────────
# Variant B Phase-2 cut-over — TLS server-block for the new primary
# RU domain (ailookstudio.ru + www.ailookstudio.ru).
#
# Этот файл копируется из репо в named volume nginx_extra_conf
# скриптом deploy/ru/update.sh ПОСЛЕ того как certbot успешно
# выпустит cert для ailookstudio.ru. До этого момента файл
# отсутствует в /etc/nginx/conf.d/extra/, и nginx стартует без
# попытки загрузить несуществующий ssl_certificate.
#
# Отвечает 1:1 за тот же набор location'ов, что и блок
# ru.ailookstudio.ru в default.conf — потому что фактически это
# то же самое приложение под двумя именами.
# ────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    http2 on;
    server_name ailookstudio.ru www.ailookstudio.ru;

    ssl_certificate     /etc/letsencrypt/live/ailookstudio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ailookstudio.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_AILOOK:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12m;

    # Canonical: www → apex via 301 (SEO + один tls-host).
    if ($host = www.ailookstudio.ru) {
        return 301 https://ailookstudio.ru$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /favicon.png {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /img/logo.png {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/v1/sse/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_connect_timeout 10s;
    }

    location /internal/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location ^~ /storage/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache storage_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /health {
        proxy_pass http://api_backend;
    }

    location /readiness {
        proxy_pass http://api_backend;
    }

    location /openapi.json {
        proxy_pass http://api_backend;
    }

    location /docs {
        proxy_pass http://api_backend;
    }

    location /redoc {
        proxy_pass http://api_backend;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
