# ────────────────────────────────────────────────────────────────────────
# Phase-3: send all legacy ru.ailookstudio.ru traffic to the canonical
# ailookstudio.ru domain via 301 Moved Permanently.
#
# Этот файл копируется поверх ru-legacy.conf в named volume
# nginx_extra_conf скриптом deploy/ru/update.sh, когда выполнены ВСЕ
# три условия одновременно:
#
#   1. ailookstudio.ru TLS-сертификат уже выпущен и установлен
#      (Phase 2 cut-over пройден, ru.ailookstudio.ru больше не
#      единственная точка входа RU edge).
#   2. Админ выставил в env: RU_LEGACY_REDIRECT_ENABLED=1
#      (на VPS — в .env.ru, через CI — GitHub-secret того же имени).
#   3. dig ailookstudio.ru возвращает IP этого VPS (повторная
#      проверка на случай отката DNS).
#
# Откат: убрать RU_LEGACY_REDIRECT_ENABLED, следующий deploy положит
# обратно ru-legacy.conf и SPA/API на старом домене снова заработают
# (если сертификат /etc/letsencrypt/live/ru.ailookstudio.ru/ ещё жив).
# ────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    http2 on;
    server_name ru.ailookstudio.ru;

    ssl_certificate     /etc/letsencrypt/live/ru.ailookstudio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru.ailookstudio.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # SEO: 301 Moved Permanently сохраняет PageRank и обновляет
    # ссылки в индексе Яндекса/Google. Закладки браузеров и старые
    # OAuth callback URLs в кабинетах провайдеров (Yandex / VK ID /
    # Google) продолжают работать прозрачно — провайдеры следуют
    # 301 при exchange code.
    return 301 https://ailookstudio.ru$request_uri;
}
